name: Crucible API compatibility

on:
  workflow_call:
    inputs:
      crucible-ref:
        description: Optional release tag or full commit; otherwise use the proposed service's Cargo.lock.
        default: ''
        type: string
      baseline-ref:
        description: Baseline tag or commit; defaults to the PR base SHA.
        default: ''
        type: string
      smithy-path:
        description: Deprecated alias for model-path.
        default: ''
        type: string
      model-path:
        description: .cru package directory relative to each checkout.
        default: model
        type: string
      config-path:
        description: Optional policy path relative to the proposed checkout; otherwise use the model package's manifest.
        default: ''
        type: string
      service:
        description: Fully qualified service ID when there is more than one service.
        default: ''
        type: string
    secrets:
      CRUCIBLE_READ_TOKEN:
        description: Optional API and source checkout token; public tooling needs no extra credentials.
        required: false

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Select baseline
        id: baseline
        env:
          BASELINE_REF: ${{ inputs.baseline-ref || github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          value = os.environ['BASELINE_REF']
          if not value or '\n' in value or '\r' in value:
              raise SystemExit('Provide baseline-ref outside a pull_request event.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={value}\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: service
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.baseline.outputs.ref }}
          path: baseline
          persist-credentials: false
      - uses: Operation-Leyline/crucible-actions/setup-crucible@a455740f063965b4b7fd96a0591e77db0f466409
        with:
          crucible-ref: ${{ inputs.crucible-ref }}
          working-directory: service
          token: ${{ secrets.CRUCIBLE_READ_TOKEN || github.token }}
      - uses: Operation-Leyline/crucible-actions/api-diff@a455740f063965b4b7fd96a0591e77db0f466409
        id: diff
        with:
          before: baseline/${{ inputs.smithy-path || inputs.model-path }}
          after: service/${{ inputs.smithy-path || inputs.model-path }}
          config: ${{ inputs.config-path && format('service/{0}', inputs.config-path) || '' }}
          service: ${{ inputs.service }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-diff-report
          path: api-diff-report
          if-no-files-found: ignore
