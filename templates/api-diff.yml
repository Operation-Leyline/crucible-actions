name: API compatibility

on:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # These names match the existing crucible-ci-read App integration.
      # Its Operation-Leyline installation must include both listed repos.
      - name: Authenticate private tooling checkout
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CRUCIBLE_APP_ID }}
          private-key: ${{ secrets.CRUCIBLE_APP_PRIVATE_KEY }}
          owner: Operation-Leyline
          repositories: |
            crucible
            crucible-actions
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: Operation-Leyline/crucible-actions
          # Pin the shared actions independently of the checker.
          ref: 2daa56af9945fef2f0342acd8644d3c4e707cd96
          token: ${{ steps.app-token.outputs.token }}
          path: crucible-actions
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: service
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: ./crucible-actions/setup-crucible
        id: tooling
        with:
          crucible-ref: 2284660bd624260ca9601001811f7119a43aebb3
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./crucible-actions/api-diff
        with:
          cli: ${{ steps.tooling.outputs.cli }}
          baseline-directory: baseline
          proposed-directory: service
          model-path: model/model.json
          # For exported ASTs, use target/crucible-model.json and add:
          # build-command: cargo build --locked -p YOUR_SERVICE_PACKAGE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-diff-report
          path: api-diff-report
          if-no-files-found: ignore
