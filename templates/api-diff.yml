name: API compatibility report

on:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: service
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: Operation-Leyline/crucible-actions/setup-crucible@4e2aa84e2f91beb18821932e7a1a2cc125823a98
        with:
          working-directory: service
      - uses: Operation-Leyline/crucible-actions/api-diff@4e2aa84e2f91beb18821932e7a1a2cc125823a98
        with:
          before: baseline/model
          after: service/model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-diff-report
          path: api-diff-report
          if-no-files-found: ignore
