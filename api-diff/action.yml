name: Check Crucible API compatibility
description: Compare two .cru packages and preserve a readable compatibility report.
inputs:
  cli:
    description: Crucible executable; setup-crucible adds it to PATH.
    default: crucible
  before:
    description: Baseline .cru package directory, relative to the workspace.
    required: true
  after:
    description: Proposed .cru package directory, relative to the workspace.
    required: true
  config:
    description: Optional workspace-relative policy path; defaults to after/crucible.toml.
    default: ''
  service:
    description: Fully qualified service ID when the package contains several services.
    default: ''
  report-path:
    description: Destination directory for the JSON and Markdown reports.
    default: api-diff-report
outputs:
  report-path:
    description: Directory containing the reports.
    value: ${{ steps.compare.outputs.report-path }}
runs:
  using: composite
  steps:
    - id: compare
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI: ${{ inputs.cli }}
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        CONFIG: ${{ inputs.config }}
        SERVICE: ${{ inputs.service }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        python3 "$ACTION_PATH/check.py" \
          --cli "$CLI" --before "$BEFORE" --after "$AFTER" --config "$CONFIG" \
          --service "$SERVICE" --report-path "$REPORT_PATH"
