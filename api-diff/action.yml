name: Check Crucible API compatibility
description: Assemble and compare two Smithy source directories using a pinned Crucible checker.
inputs:
  cli:
    description: Absolute path to the Crucible executable.
    required: true
  before:
    description: Baseline Smithy directory (or JSON AST), relative to the workspace.
    required: true
  after:
    description: Proposed Smithy directory (or JSON AST), relative to the workspace.
    required: true
  config:
    description: Compatibility policy path, relative to the workspace.
    default: crucible.toml
  service:
    description: Absolute Smithy service ID when the model contains several services.
    default: ''
  report-path:
    description: Destination directory for the JSON and Markdown reports.
    default: api-diff-report
outputs:
  report-path:
    description: Directory containing the reports.
    value: ${{ steps.compare.outputs.report-path }}
runs:
  using: composite
  steps:
    - id: compare
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLI: ${{ inputs.cli }}
        BEFORE: ${{ inputs.before }}
        AFTER: ${{ inputs.after }}
        CONFIG: ${{ inputs.config }}
        SERVICE: ${{ inputs.service }}
        REPORT_PATH: ${{ inputs.report-path }}
      run: |
        python3 "$ACTION_PATH/check.py" \
          --cli "$CLI" --before "$BEFORE" --after "$AFTER" --config "$CONFIG" \
          --service "$SERVICE" --report-path "$REPORT_PATH"
